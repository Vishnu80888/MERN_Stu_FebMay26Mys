<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postioning Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #8cee99;
            margin: 20px;
        }
        .box {
            position: relative;
            top: 20%;
            left: 100px;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid black;
            text-align: center;
            line-height: 100px;
            border-radius: 20px;
            box-shadow: inset 2px 4px 10px rgba(0, 0, 0, 0.5);
            color: darkred;
          }

    </style>
</head>
<body>
    <h1>Positioning Elements</h1>
    <h2>Relative Positioning</h2>
    <p>Relative positioning moves an element relative to its normal position in the document flow.</p>
    <div class="box">Relative Box</div>
    <p>In this example, the box is moved 20 pixels down and 100 pixels to the right from its original position.</p>

</body>
</html>
