<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8ae72;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: darkblue;
        }
        .container {
            position: relative;
            width: 1000px;
            height: 500px;
            margin: 0 auto;
        }
          .box1 ,.box2 {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            text-align: center;
            line-height: 100px;
            box-shadow: 80px 80px 10px rgba(0, 0, 0, 0.5);
            opacity: 50%;
          }
          .box1 {
            top: 50px;
            left: 400px;
            background-color: rgb(0, 68, 255);
            color: darkred;
            z-index: 1;
          }
            .box2 {
                top: 100px;
                left: 450px;
                background-color: rgb(162, 0, 255);
                color: darkred;
                z-index: -2;
            }
    </style>
</head>
<body>
    <h1>Z-Index</h1>
    <div class="container">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div> 
    </div>
    
</body>
</html>
