<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postioning Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #8cee99;
            margin: 20px;
        }
        .box {
            position: static;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid black;
            position: static;
            text-align: center;
            line-height: 100px;
            border-radius: 20px;
            box-shadow: inset 2px 4px 10px rgba(0, 0, 0, 0.5);
            color: darkred;
          }

    </style>
</head>
<body>
    <h1>Positioning Elements</h1>
    <h2>Static Positioning</h2>
    <div class="box">StaticBox</div>

</body>
</html>
