<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Functions</title>
    <style>
        .transform-box {
            width: 150px;
            height: 150px;
            background-color: green;
            transition: transform 0.5s ease-in-out;
            margin: 200px auto;
        }
        .transform-box:hover {
            transform: translate(100px, 50px) rotate(360deg) scale(1.5);
        }    
    </style>
</head>
<body>
    <h1>Transform Functions</h1>
    <div class="transform-box"></div>
    
</body>
</html>
