<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Tasks</title>

<style>

/* 1. Sticky Navbar */
.navbar {
    position: sticky;
    top: 0;
    background: black;
    padding: 15px;
    text-align: center;
    z-index: 1000;
    color: blanchedalmond;
}

.navbar a:hover {
    color: yellow;
}

/* Content for scrolling */
.content {
    height: 1000px;
    padding: 20px;
}

/* 3. Fixed Footer */
.footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: black;
    color: white;
    text-align: center;
    padding: 10px;
}

/* 4. Button Hover Animation */
.btn {
    position: absolute;
    padding: 25px 50px;
    background: blue;
    color: white;
    border: none;
    cursor: pointer;
    transition: 0.4s;
}

.btn:hover {
    background: red;
    transform: scale(1.2);
}

/* 5. Bouncing Ball Animation */
.ball {
    width: 100px;
    height: 100px;
    background: rgb(19, 255, 19);
    border-radius: 50%;
    position: relative;
    animation-delay: 0.2s;
    animation: bounce 1s infinite alternate;
}

@keyframes bounce {
    from { top: 0; }
    to { top: 200px; }
}

/* 7. Design Image using position: relative */

.house {
    position: relative;
    width: 300px;
    height: 300px;
    background: #b7e21f;
    margin: 50px auto;
    border: 5px solid black;
}

/* Roof */
.roof {
    position: relative;
    width: 350px;
    height: 40px;
    background: orange;
    top: -40px;
    left: -25px;
    border: 5px solid black;
}

/* Door */
.door {
    position: relative;
    width: 70px;
    height: 120px;
    background: blue;
    top: 120px;
    left: 110px;
    border: 5px solid black;
}

/* Left Window */
.window1 {
    position: relative;
    width: 60px;
    height: 100px;
    background: yellow;
    top: -150px;
    left: 40px;
    border: 5px solid black;
}

/* Right Window */
.window2 {
    position: relative;
    width: 60px;
    height: 80px;
    background: purple;
    top: -250px;
    left: 200px;
    border: 5px solid black;
}

/* 2. Z-index Example */
.box1, .box2 {
    width: 100px;
    height: 100px;
    position: relative;
}

.box1 {
    background: red;
    top: 50px;
    left: 50px;
    z-index: 1;
}

.box2 {
    background: blue;
    top: -20px;
    left: 80px;
    z-index: 2; 
}

</style>
</head>

<body>

<!-- 1. Sticky Navbar -->
<div class="navbar">
    <marquee><h1>House Design</h1></marquee>
</div>

<div class="content">
    <h2>Z-Index Example</h2>
    <div class="box1"></div>
    <div class="box2"></div>

    <br><br>

    <h2>Button Hover Effect</h2>
    <button class="btn">Hover Me</button>

    <br><br>
    <br>
    <h2>Bouncing Ball</h2>
    <div class="ball"></div>

    <br><br>

    <h2>House Design</h2>
    <div class="house">
        <div class="roof"></div>
        <div class="door"></div>
        <div class="window1"></div>
        <div class="window2"></div>
    </div>

</div>

<!-- 3. Fixed Footer -->
<div class="footer">
    Fixed Footer
</div>

</body>
</html>
