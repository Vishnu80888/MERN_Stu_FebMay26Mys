<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postioning Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #8cee99;
            margin: 20px;
        }
        h1, h2 {
            text-align: center;
            color: darkblue;
        }
          .box1 {
            position: relative;
            top: 200px;
            left: 500px;
            width: 400px;
            height: 250px;
            background-color: rgb(10, 243, 34);
            border: 2px solid black;
            text-align: center;
            line-height: 100px;
            box-shadow: inset 2px 4px 10px rgba(0, 0, 0, 0.5);
            color: darkred;
          }
          .box2 {
            position: relative;
            bottom: 150px;
            left: 400px;
            width: 600px;
            height: 100px;
            background-color: rgb(230, 0, 0);
            border: 2px solid black;
            text-align: center;
            line-height: 100px;
            box-shadow: inset 2px 4px 10px rgba(0, 0, 0, 0.5);
            color: darkred;
          }
          .box3 {
            position: relative;
            bottom: 55px;
            left: 650px;
            width: 100px;
            height: 150px;
            background-color: rgb(110, 96, 240);

            text-align: center;
            line-height: 100px;
            box-shadow: inset 2px 4px 10px rgba(0, 0, 0, 0.5);
            color: darkred;
          }
          .box4 {
            position: relative;
            bottom: 250px;
            left: 550px;

            height: 75px;

            text-align: center;

            .box5 {

                border: 2px solid black;
                text-align: center;
                line-height: 100px;
                box-shadow: inset 2px 4px 10px rgba(0, 0, 0, 0.5);
                color: darkred;
            }
          

    </style>
</head>
<body>
    <h1>Positioning Elements</h1>
    <h2>Relative Positioning</h2>
    <h1>creating a HOME</h1>
    <div class="box1"></div>
    <div class="box2"></div> 
    <div class="box3"></div>

</html>
