<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <div class="m-6">
        <input type="text" placeholder="Enter the Name" class="peer border border-gray-800 rounded-md px-3 py-2 w-50">
        <p class="text-red-500 mt-2 hidden peer-focus:block">
            I Show Up when input is Focused
        </p>
        <input type="checkbox" 
        class="w-5 h-5 appearance-none border border-gray-800 rounded 
        checked:bg-blue-800 checked:border-blue-800 focus:ring-2 focus:ring-blue-500">
        <input type="radio"  class="w-5 h-5 appearance-none border border-gray-800 rounded 
        checked:bg-blue-800 checked:border-blue-800 focus:ring-2 focus:ring-blue-500">
    </div>
</body>
</html>
