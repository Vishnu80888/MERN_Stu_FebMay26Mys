<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Overlay : dim background</title>
</head>

<body>
    <main class="max-w-4xl mx-auto p-6 space-y-8">
        <h1 class="text-2xl fent-bold">Overlay text background </h1>
        <section class="border rounded p-6 ">
            <div class="grid md:grid-cols-2 gap-2">
                <div class="h-32 rounded bg-[linear-gradient(135deg,#A2DBC6,#846FED)]">
                    Card 1
                </div>
                <div class="h-32 rounded bg-[linear-gradient(135deg,#00E6DC,#E600BB)]">
                    Card 2
                </div>
                <p class="mt-4 text-lg">This is the content behind overlay</p>
            </div>
        </section>
        <div id="overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
            <div class="w-[min(520px,92vw)] bg-white rounded p-6 shadow-lg">
                <h2 class="text-lg font-bold">My modal window</h2>
                <p class="text-sm mt-2">Here is my second modal window that i created...
                </p>
                 <div class=" mt-6 flex justify-end">
                <button id="closebtn" class="px-4 py-2 rounded border hover:bg-red-100 transition">Close</button>
            </div>
            </div>
        </div>
    </main>
    <script>
        //click button to close
        const closebtn = document.getElementById("closebtn")
        .addEventListener("click", () => {
            overlay.style.display = 'none';
        });
        //click outside of modal to close
        overlay.addEventListener("click", (e) => {
            if(e.target === overlay)
            overlay.style.display = 'none';
        });

    </script>
</body>

</html>
