<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Basic of the flex in tailwind css</title>
</head>
<body>
    <section class="border border-black border-2 p-6 m-6 space-y-10 ">
        <h2 class="text-center"> Without Flex</h2>
        <div class="borderborder-black border-2  rounded-lg p-4 space-y-5">
            <div class="bg-gray-100 rounded p3">Logo</div>
            <div class="bg-gray-100 rounded p3">Link</div>
            <div class="bg-gray-100 rounded p3">Contact</div>
            
        </div>
    </section>
    <br>
    <section class="border border-black border-2 p-6  m-6 space-y-10  ">
        <h2 class="text-center"> With Flex</h2>
        <div class="border border-black border-2 rounded-lg p-4 space-y-5 flex gap-10">
            <div class="bg-gray-100 rounded p3">Logo</div>
            <div class="bg-gray-100 rounded p3">Link</div>
            <div class="bg-gray-100 rounded p3">Contact</div>
            
        </div>
    </section>
</body>
</html>
